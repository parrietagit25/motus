ServerTokens Prod
ServerSignature Off
TraceEnable Off

# El servidor tiene ~1 GB de RAM compartido con MySQL: 150 procesos prefork con
# memory_limit 256M no caben. MaxConnectionsPerChild recicla procesos periódicamente.
<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers       15
    MaxConnectionsPerChild 500
</IfModule>
